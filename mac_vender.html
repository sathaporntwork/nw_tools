<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Free MAC Address Vendor Lookup Tool. Find the manufacturer of any device.">
    <meta name="keywords" content="mac address, vendor lookup, oui, mac vendor, manufacturer, network">
    <title>MAC Address Vendor Lookup</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23f97316%22 stroke-width=%222%22><circle cx=%2212%22 cy=%2212%22 r=%2210%22></circle><line x1=%2212%22 y1=%228%22 x2=%2212%22 y2=%2212%22></line><line x1=%2212%22 y1=%2216%22 x2=%2212.01%22 y2=%2216%22></line></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/common.css">

    <style>
        .input-group label svg {
            animation: rotate 10s linear infinite;
        }

        @keyframes rotate {
            from {
                transform: rotate(0deg);
            }

            to {
                transform: rotate(360deg);
            }
        }

        .spinner {
            display: inline-block;
            width: 1em;
            height: 1em;
            border: 2px solid currentColor;
            border-right-color: transparent;
            border-radius: 50%;
            animation: spin 0.75s linear infinite;
            display: none;
        }

        .loading .spinner {
            display: inline-block;
        }

        .loading .btn-text {
            opacity: 0.8;
        }

        @keyframes spin {
            to {
                transform: rotate(360deg);
            }
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <svg class="logo-icon" xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="10"></circle>
                    <line x1="12" y1="8" x2="12" y2="12"></line>
                    <line x1="12" y1="16" x2="12.01" y2="16"></line>
                </svg>
                <h1>MAC Vendor Lookup</h1>
                <button id="theme-toggle" class="theme-toggle" aria-label="Toggle theme">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <circle cx="12" cy="12" r="5" />
                        <line x1="12" y1="1" x2="12" y2="3" />
                        <line x1="12" y1="21" x2="12" y2="23" />
                        <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                        <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                        <line x1="1" y1="12" x2="3" y2="12" />
                        <line x1="21" y1="12" x2="23" y2="12" />
                        <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                        <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                    </svg>
                </button>
            </div>

            <div class="input-group">
                <label for="mac-input">
                    <svg xmlns="http://www.w3.org/2000/svg" width="14" height="14" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <rect x="2" y="2" width="20" height="8" rx="2" ry="2" />
                        <rect x="2" y="14" width="20" height="8" rx="2" ry="2" />
                        <line x1="6" y1="6" x2="6.01" y2="6" />
                        <line x1="6" y1="18" x2="6.01" y2="18" />
                    </svg>
                    MAC Address
                </label>
                <input type="text" id="mac-input" placeholder="e.g. 00:1A:2B:3C:4D:5E or E0CC.7A84.FA4E"
                    autocomplete="off">
                <div id="error-message" class="error-message"></div>
            </div>

            <button id="lookup-btn">
                <span class="spinner"></span>
                <span class="btn-text">Find Vendor</span>
                <svg class="btn-icon" xmlns="http://www.w3.org/2000/svg" width="18" height="18" viewBox="0 0 24 24"
                    fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="11" cy="11" r="8"></circle>
                    <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                </svg>
            </button>

            <div id="results" class="results">
                <div class="result-item">
                    <span class="result-label">Vendor</span>
                    <span class="result-value" id="vendor-name"></span>
                </div>
                <div class="result-item">
                    <span class="result-label">MAC Address</span>
                    <span class="result-value" id="mac-address-display"></span>
                </div>
                <div class="result-item" style="display:none;" id="mac-prefix-container">
                    <span class="result-label">OUI Prefix</span>
                    <span class="result-value" id="mac-prefix"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        class MacVendorLookup {
            constructor() {
                this.input = document.getElementById('mac-input');
                this.lookupBtn = document.getElementById('lookup-btn');
                this.resultsContainer = document.getElementById('results');
                this.errorMessage = document.getElementById('error-message');
                this.vendorNameEl = document.getElementById('vendor-name');
                this.macDisplayEl = document.getElementById('mac-address-display');
                this.prefixEl = document.getElementById('mac-prefix');
                this.prefixContainer = document.getElementById('mac-prefix-container');
                this.themeToggle = document.getElementById('theme-toggle');

                this.lookupBtn.addEventListener('click', () => this.lookup());
                this.input.addEventListener('keypress', (e) => {
                    if (e.key === 'Enter') this.lookup();
                });
                this.themeToggle.addEventListener('click', () => ThemeManager.toggle());
            }

            async lookup() {
                this.clearError();
                this.resultsContainer.classList.remove('visible');

                const rawInput = this.input.value.trim();
                if (!rawInput) {
                    this.showError('Please enter a MAC address');
                    return;
                }

                // Normalize input
                const cleanedMac = this.normalizeMac(rawInput);
                if (!cleanedMac) {
                    this.showError('Invalid MAC Address format');
                    return;
                }

                this.setLoading(true);

                try {
                    // Try using corsproxy.io which is often more reliable for this purpose
                    const corsProxy = 'https://corsproxy.io/?';
                    const targetUrl = `https://api.macvendors.com/${cleanedMac}`;

                    // Note: We are encoding the target URL for the proxy
                    const response = await fetch(corsProxy + encodeURIComponent(targetUrl));

                    if (!response.ok) {
                        if (response.status === 404) {
                            throw new Error('Vendor not found');
                        } else if (response.status === 429) {
                            throw new Error('Too many requests. Please wait a moment.');
                        } else {
                            throw new Error('Could not fetch vendor info (Network/API Error)');
                        }
                    }

                    const vendor = await response.text();
                    this.displayResults(vendor, cleanedMac);
                } catch (error) {
                    console.error(error);
                    let errorMsg = error.message;
                    if (errorMsg.includes('Failed to fetch') || errorMsg.includes('NetworkError')) {
                        errorMsg = 'Strict Browser Security detected. Browsers may block external API calls from local files (file://). <br><br><b>Solution:</b><br>1. Open this file using a local server (e.g. VS Code "Live Server")<br>2. Or disable CORS in your browser (development only)';
                        this.showError(errorMsg);
                    } else {
                        this.showError(errorMsg);
                    }
                } finally {
                    this.setLoading(false);
                }
            }

            normalizeMac(input) {
                // Remove all non-hex characters
                const stripped = input.replace(/[^a-fA-F0-9]/g, '');

                // Check valid length (12 characters for full MAC, 6 for OUI)
                if (stripped.length !== 12 && stripped.length !== 6) {
                    return null;
                }

                // Format as XX:XX:XX:XX:XX:XX
                let formatted = '';
                for (let i = 0; i < stripped.length; i += 2) {
                    formatted += stripped.substr(i, 2);
                    if (i < stripped.length - 2) formatted += ':';
                }

                return formatted.toUpperCase();
            }

            displayResults(vendor, mac) {
                this.vendorNameEl.textContent = vendor;
                this.macDisplayEl.textContent = mac;

                // Show prefix if available (first 3 octets)
                const prefix = mac.split(':').slice(0, 3).join(':');
                this.prefixEl.textContent = prefix;
                this.prefixContainer.style.display = 'flex';

                this.resultsContainer.classList.add('visible');
            }

            showError(msg) {
                this.errorMessage.innerHTML = msg; // Changed to innerHTML to support <br>
            }

            clearError() {
                this.errorMessage.textContent = '';
            }

            setLoading(isLoading) {
                if (isLoading) {
                    this.lookupBtn.classList.add('loading');
                    this.lookupBtn.disabled = true;
                    this.lookupBtn.querySelector('.btn-icon').style.display = 'none';
                } else {
                    this.lookupBtn.classList.remove('loading');
                    this.lookupBtn.disabled = false;
                    this.lookupBtn.querySelector('.btn-icon').style.display = 'block';
                }
            }
        }

        new MacVendorLookup();
    </script>

    <div class="footer">
        <p>Modern Network Tools Suite • Built with ❤️ for Network Engineers</p>
    </div>

    <script src="assets/js/theme.js"></script>
</body>

</html>
