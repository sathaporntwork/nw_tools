<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description"
        content="Configuration Compare - Compare two text configurations side-by-side with difference highlighting">
    <title>Configuration Compare</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 24 24%22 fill=%22none%22 stroke=%22%23f97316%22 stroke-width=%222%22><rect x=%223%22 y=%223%22 width=%2218%22 height=%2218%22 rx=%222%22/><path d=%22M9 3v18%22/><path d=%22M15 3v18%22/></svg>">

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/common.css">

    <!-- Diff Library -->
    <script src="https://cdn.jsdelivr.net/npm/diff@5.2.0/dist/diff.min.js"></script>

    <style>
        /* Specific overrides for Compare tool */
        .container {
            max-width: 95%;
            /* Use more width for side-by-side comparison */
        }

        .compare-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 1.5rem;
            margin-bottom: 2rem;
        }

        .compare-pane {
            display: flex;
            flex-direction: column;
            gap: 0.5rem;
        }

        .pane-header {
            font-weight: 600;
            color: var(--text-muted);
            text-align: center;
        }

        /* Adjust textarea for this page */
        .input-wrapper {
            display: flex;
            border: 1px solid var(--border-color);
            background: var(--bg-input);
            border-radius: 12px;
            overflow: hidden;
        }

        .input-wrapper:focus-within {
            border-color: var(--accent-primary);
            box-shadow: 0 0 0 3px rgba(249, 115, 22, 0.15);
        }

        .input-line-numbers {
            background-color: rgba(0, 0, 0, 0.05);
            /* very subtle */
            color: var(--text-muted);
            text-align: right;
            padding: 1rem 0.5rem;
            width: 45px;
            min-width: 45px;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            user-select: none;
            overflow: hidden;
            border-right: 1px solid var(--border-color);
        }

        textarea {
            height: 300px;
            font-size: 13px;
            font-family: 'JetBrains Mono', monospace;
            line-height: 1.5;
            flex: 1;
            border: none;
            border-radius: 0;
            white-space: pre;
            overflow: auto;
            resize: none;
            padding: 1rem;
            background: transparent;
        }

        textarea:focus {
            box-shadow: none;
            border: none;
            background: transparent;
        }

        /* Result Area */
        .diff-container {
            display: none;
            /* Hidden by default */
            background: var(--bg-card);
            border: 1px solid var(--border-color);
            border-radius: 12px;
            overflow: hidden;
            margin-top: 2rem;
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
        }

        .diff-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            font-family: 'JetBrains Mono', monospace;
            font-size: 13px;
            line-height: 1.5;
            overflow-x: auto;
        }

        .diff-side {
            padding: 1rem 0;
            overflow-x: auto;
        }

        .diff-side.left {
            border-right: 1px solid var(--border-color);
        }

        .diff-line {
            display: flex;
            width: 100%;
            min-width: fit-content;
        }

        .line-number {
            width: 40px;
            min-width: 40px;
            text-align: right;
            padding-right: 0.5rem;
            color: var(--text-muted);
            user-select: none;
            border-right: 1px solid var(--border-color);
            margin-right: 0.5rem;
            opacity: 0.5;
            background: rgba(0, 0, 0, 0.1);
        }

        .line-content {
            padding-right: 1rem;
            white-space: pre;
            flex: 1;
        }

        /* Diff Colors */
        .diff-added {
            background-color: rgba(16, 185, 129, 0.2);
            color: #d1fae5;
        }

        [data-theme="light"] .diff-added {
            background-color: rgba(16, 185, 129, 0.2);
            color: #064e3b;
        }

        .diff-removed {
            background-color: rgba(239, 68, 68, 0.2);
            color: #fee2e2;
        }

        [data-theme="light"] .diff-removed {
            background-color: rgba(239, 68, 68, 0.2);
            color: #7f1d1d;
        }

        .diff-empty {
            background-color: rgba(0, 0, 0, 0.05);
        }

        /* Controls */
        .controls {
            display: flex;
            justify-content: center;
            gap: 1rem;
            margin-bottom: 2rem;
        }

        .btn-secondary {
            background: transparent;
            border: 1px solid var(--border-color);
            color: var(--text-main);
            box-shadow: none;
        }

        .btn-secondary:hover {
            backdrop-filter: brightness(1.1);
            background: rgba(255, 255, 255, 0.05);
        }

        /* Responsive */
        @media (max-width: 768px) {
            .compare-grid {
                grid-template-columns: 1fr;
            }

            .diff-grid {
                grid-template-columns: 1fr;
                /* Stack results on mobile */
            }

            .diff-side.left {
                border-right: none;
                border-bottom: 1px solid var(--border-color);
            }
        }

        /* Drag and Drop Styling */
        /* Drag and Drop Styling */
        .input-wrapper.drag-over {
            border: 2px dashed var(--accent-primary);
            background: rgba(249, 115, 22, 0.05);
        }

        /* Footer override if needed */
        .footer {
            margin-top: auto;
            padding-bottom: 2rem;
        }

        /* Body alignment overrides */
        body {
            justify-content: flex-start;
            padding-top: 2rem;
        }

        /* Button Colors */
        /* Button Colors */
        #compareBtn {
            background-image: linear-gradient(135deg, #34d399, #059669);
            box-shadow: 0 4px 15px -3px rgba(16, 185, 129, 0.4);
            overflow: visible;
            /* Ensure nothing is clipped */
        }

        #compareBtn:hover {
            box-shadow: 0 8px 20px -3px rgba(16, 185, 129, 0.6);
            background-image: linear-gradient(135deg, #10b981, #047857);
            transform: translateY(-2px);
        }

        #clearBtn {
            background-image: linear-gradient(135deg, #f87171, #b91c1c);
            color: white;
            border: none;
            box-shadow: 0 4px 15px -3px rgba(239, 68, 68, 0.4);
            overflow: visible;
        }

        #clearBtn:hover {
            box-shadow: 0 8px 20px -3px rgba(239, 68, 68, 0.6);
            background-image: linear-gradient(135deg, #ef4444, #991b1b);
            transform: translateY(-2px);
        }

        /* Remove the common.css 'shine' effect overlay which might be making it look solid/flat */
        #compareBtn::after,
        #clearBtn::after {
            display: none;
        }
    </style>
</head>

<body>
    <main class="container">
        <div class="header">
            <div class="logo-icon">
                <svg xmlns="http://www.w3.org/2000/svg" width="32" height="32" viewBox="0 0 24 24" fill="none"
                    stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                    <rect x="3" y="3" width="18" height="18" rx="2" />
                    <path d="M9 3v18" />
                    <path d="M15 3v18" />
                </svg>
            </div>
            <h1>Configuration Compare</h1>
            <button class="theme-toggle" onclick="ThemeManager.toggle()" id="themeBtn" aria-label="Toggle theme">
                <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                    stroke-linecap="round" stroke-linejoin="round">
                    <circle cx="12" cy="12" r="5" />
                    <line x1="12" y1="1" x2="12" y2="3" />
                    <line x1="12" y1="21" x2="12" y2="23" />
                    <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                    <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                    <line x1="1" y1="12" x2="3" y2="12" />
                    <line x1="21" y1="12" x2="23" y2="12" />
                    <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                    <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                </svg>
            </button>
        </div>

        <section class="card">
            <div class="controls">
                <button id="compareBtn">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M16 3h5v5" />
                        <path d="M21 3L9 15" />
                        <path d="M3 21l3 0" />
                        <path d="M3 21l0 -3" />
                        <circle cx="5" cy="19" r="2" />
                    </svg>
                    Compare Configs
                </button>
                <button id="clearBtn" class="btn-secondary">
                    <svg xmlns="http://www.w3.org/2000/svg" width="20" height="20" viewBox="0 0 24 24" fill="none"
                        stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                        <path d="M3 6h18" />
                        <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6" />
                        <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2" />
                    </svg>
                    Clear All
                </button>
            </div>

            <div class="compare-grid">
                <div class="compare-pane">
                    <div class="pane-header">Original Configuration (Left)</div>
                    <div class="input-wrapper">
                        <div class="input-line-numbers" id="linesOriginal">1</div>
                        <textarea id="original" placeholder="Paste original configuration here..."></textarea>
                    </div>
                </div>
                <div class="compare-pane">
                    <div class="pane-header">Modified Configuration (Right)</div>
                    <div class="input-wrapper">
                        <div class="input-line-numbers" id="linesModified">1</div>
                        <textarea id="modified" placeholder="Paste modified configuration here..."></textarea>
                    </div>
                </div>
            </div>
        </section>

        <div id="diffContainer" class="diff-container">
            <div class="diff-grid">
                <div class="diff-side left" id="resultLeft"></div>
                <div class="diff-side right" id="resultRight"></div>
            </div>
        </div>

    </main>

    <div class="footer">
        <p>Modern Network Tools Suite • Built with ❤️ for Network Engineers</p>
    </div>

    <script src="assets/js/theme.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            const originalInput = document.getElementById('original');
            const modifiedInput = document.getElementById('modified');
            const compareBtn = document.getElementById('compareBtn');
            const clearBtn = document.getElementById('clearBtn');
            const diffContainer = document.getElementById('diffContainer');
            const resultLeft = document.getElementById('resultLeft');
            const resultRight = document.getElementById('resultRight');

            // Compare Function
            compareBtn.addEventListener('click', () => {
                const originalText = originalInput.value;
                const modifiedText = modifiedInput.value;

                if (!originalText && !modifiedText) return;

                // Perform Diff
                // Using Diff.diffLines from the CDN library
                const diff = Diff.diffLines(originalText, modifiedText, { newlineIsToken: false, ignoreWhitespace: false });

                renderDiff(diff);
                diffContainer.style.display = 'block';

                // Scroll to result
                diffContainer.scrollIntoView({ behavior: 'smooth' });
            });

            // Clear Function
            clearBtn.addEventListener('click', () => {
                originalInput.value = '';
                modifiedInput.value = '';
                diffContainer.style.display = 'none';
                resultLeft.innerHTML = '';
                resultRight.innerHTML = '';
            });

            function renderDiff(diff) {
                let leftHTML = '';
                let rightHTML = '';
                let leftLineNum = 1;
                let rightLineNum = 1;

                // Process chunks to align them
                for (let i = 0; i < diff.length; i++) {
                    const part = diff[i];

                    if (part.added) {
                        // If previous was removed, we might have already handled alignment (not implemented in simple version yet)
                        // But here, we just render ADDED lines to Right
                        // And empty lines to Left to maintain alignment IF explicitly strictly aligned
                        // Strict alignment is complex. 
                        // Implementation strategy: 
                        // Check if previous part was 'removed'. If so, we treat this as a modification block.
                        // We already rendered the 'removed' block. 
                        // Wait, if we process sequentially, we can't easily align.

                        // Let's use a simpler approach for "aligned":
                        // If we see REMOVED then ADDED, we try to align them side-by-side.
                        // This requires "looking ahead" or grouping.

                        // However, current loop index 'i'.
                        // If part is ADDED, check if previous was REMOVED.
                        // Actually, better loop structure:
                        // Iterate and group 'removed' and 'added' that are adjacent.
                    }
                }

                // Refined Loop for Alignment
                let i = 0;
                while (i < diff.length) {
                    const part = diff[i];

                    if (part.removed) {
                        // Check if next is added
                        if (i + 1 < diff.length && diff[i + 1].added) {
                            // It's a change block
                            const removedPart = part;
                            const addedPart = diff[i + 1];

                            const removedLines = removedPart.value.split('\n');
                            if (removedPart.value.endsWith('\n')) removedLines.pop(); // Remove empty string from trailing newline

                            const addedLines = addedPart.value.split('\n');
                            if (addedPart.value.endsWith('\n')) addedLines.pop();

                            const maxLines = Math.max(removedLines.length, addedLines.length);

                            for (let j = 0; j < maxLines; j++) {
                                // Left Side (Removed)
                                if (j < removedLines.length) {
                                    leftHTML += createLineRow(leftLineNum++, removedLines[j], 'diff-removed');
                                } else {
                                    leftHTML += createEmptyRow();
                                }

                                // Right Side (Added)
                                if (j < addedLines.length) {
                                    rightHTML += createLineRow(rightLineNum++, addedLines[j], 'diff-added');
                                } else {
                                    rightHTML += createEmptyRow();
                                }
                            }
                            i += 2; // Skip next
                        } else {
                            // Just removed
                            const lines = part.value.split('\n');
                            if (part.value.endsWith('\n')) lines.pop();

                            lines.forEach(line => {
                                leftHTML += createLineRow(leftLineNum++, line, 'diff-removed');
                                rightHTML += createEmptyRow();
                            });
                            i++;
                        }
                    } else if (part.added) {
                        // Just added (since we handled the removed+added case above)
                        const lines = part.value.split('\n');
                        if (part.value.endsWith('\n')) lines.pop();

                        lines.forEach(line => {
                            leftHTML += createEmptyRow();
                            rightHTML += createLineRow(rightLineNum++, line, 'diff-added');
                        });
                        i++;
                    } else {
                        // Common/Unchanged
                        const lines = part.value.split('\n');
                        if (part.value.endsWith('\n')) lines.pop(); // Remove trailing empty line if it was split from newline

                        // For the last chunk, split('\n') might create an empty string at the end if text ends with newline.
                        // Standard behavior: 'a\n'.split('\n') -> ['a', '']

                        lines.forEach(line => {
                            leftHTML += createLineRow(leftLineNum++, line, '');
                            rightHTML += createLineRow(rightLineNum++, line, '');
                        });
                        i++;
                    }
                }

                resultLeft.innerHTML = leftHTML;
                resultRight.innerHTML = rightHTML;
            }

            function createLineRow(num, content, className) {
                // Escape HTML in content to prevent injection
                const escaped = content.replace(/&/g, "&amp;")
                    .replace(/</g, "&lt;")
                    .replace(/>/g, "&gt;")
                    .replace(/"/g, "&quot;")
                    .replace(/'/g, "&#039;");
                return `<div class="diff-line ${className}">
                            <div class="line-number">${num}</div>
                            <div class="line-content">${escaped || '&nbsp;'}</div>
                        </div>`;
            }

            function createEmptyRow() {
                return `<div class="diff-line diff-empty">
                            <div class="line-number"></div>
                            <div class="line-content">&nbsp;</div>
                        </div>`;
            }

            // Drag and Drop Logic
            function enableDragAndDrop(elementId, linesId) {
                const element = document.getElementById(elementId);
                const linesElement = document.getElementById(linesId);
                const wrapper = element.parentElement; // .input-wrapper

                ['dragenter', 'dragover', 'dragleave', 'drop'].forEach(eventName => {
                    element.addEventListener(eventName, preventDefaults, false);
                });

                function preventDefaults(e) {
                    e.preventDefault();
                    e.stopPropagation();
                }

                ['dragenter', 'dragover'].forEach(eventName => {
                    element.addEventListener(eventName, highlight, false);
                });

                ['dragleave', 'drop'].forEach(eventName => {
                    element.addEventListener(eventName, unhighlight, false);
                });

                function highlight(e) {
                    wrapper.classList.add('drag-over');
                }

                function unhighlight(e) {
                    wrapper.classList.remove('drag-over');
                }

                element.addEventListener('drop', handleDrop, false);

                function handleDrop(e) {
                    const dt = e.dataTransfer;
                    const files = dt.files;
                    if (files.length > 0) {
                        const file = files[0];
                        if (file.size > 1000000) {
                            if (!confirm("File is large (>1MB). Continue?")) return;
                        }

                        const reader = new FileReader();
                        reader.onload = function (e) {
                            element.value = e.target.result;
                            updateLineNumbers(element, linesElement);
                        };
                        reader.readAsText(file);
                    }
                }
            }

            // Line Number Logic
            function updateLineNumbers(textarea, linesElement) {
                const lines = textarea.value.split('\n').length;
                // Only regenerate if count changed to avoid flickering/performance
                if (linesElement.childElementCount !== lines) {
                    linesElement.innerHTML = Array(lines).fill(0).map((_, i) => `<div>${i + 1}</div>`).join('');
                }
            }

            function setupLineNumbers(textareaId, linesId) {
                const textarea = document.getElementById(textareaId);
                const linesElement = document.getElementById(linesId);

                const update = () => updateLineNumbers(textarea, linesElement);

                textarea.addEventListener('input', update);
                textarea.addEventListener('scroll', () => {
                    linesElement.scrollTop = textarea.scrollTop;
                });

                // Initial call
                update();
            }

            enableDragAndDrop('original', 'linesOriginal');
            enableDragAndDrop('modified', 'linesModified');
            setupLineNumbers('original', 'linesOriginal');
            setupLineNumbers('modified', 'linesModified');
        });
    </script>
</body>

</html>
