<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Script Generator</title>
    <link rel="icon"
        href="data:image/svg+xml,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>⚡</text></svg>">

    <!-- Preconnect for fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link
        href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap"
        rel="stylesheet">
    <link rel="stylesheet" href="assets/styles/common.css">
    <style>
        /* Page-specific styles for script.html */
        .container {
            max-width: 960px;
        }

        .label-row {
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        #inputText {
            min-height: 120px;
        }

        #outputText {
            min-height: 320px;
        }

        /* Tooltip hint */
        .tooltip {
            position: relative;
        }

        .tooltip::after {
            content: attr(data-tooltip);
            position: absolute;
            top: 120%;
            left: 50%;
            transform: translateX(-50%);
            margin-top: 5px;
            padding: 6px 10px;
            background: var(--text-main);
            color: var(--bg-input);
            border-radius: 6px;
            font-size: 11px;
            font-weight: 600;
            white-space: nowrap;
            opacity: 0;
            visibility: hidden;
            pointer-events: none;
            transition: opacity 0.2s, visibility 0.2s;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
            z-index: 10;
        }

        .tooltip:hover::after {
            opacity: 1;
            visibility: visible;
        }

        /* Clear Button Modern Style */
        .clear-btn {
            background: rgba(239, 68, 68, 0.15) !important;
            border: 1px solid rgba(239, 68, 68, 0.3) !important;
            color: #ef4444 !important;
        }

        .clear-btn:hover {
            background: #ef4444 !important;
            border-color: #ef4444 !important;
            color: white !important;
            box-shadow: 0 8px 20px -3px rgba(239, 68, 68, 0.5) !important;
        }

        @keyframes trash-shake {

            0%,
            100% {
                transform: rotate(0deg);
            }

            25% {
                transform: rotate(-10deg);
            }

            50% {
                transform: rotate(10deg);
            }

            75% {
                transform: rotate(-10deg);
            }
        }

        .clear-btn:hover svg {
            animation: trash-shake 0.5s ease-in-out;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="card">
            <div class="header">
                <div class="logo-icon">
                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="3"
                        stroke-linecap="round" stroke-linejoin="round">
                        <path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"></path>
                    </svg>
                </div>
                <h1>Script Generator</h1>
                <div style="display: flex; gap: 0.5rem;">
                    <button class="theme-toggle" onclick="ThemeManager.toggle()" id="themeBtn">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <circle cx="12" cy="12" r="5" />
                            <line x1="12" y1="1" x2="12" y2="3" />
                            <line x1="12" y1="21" x2="12" y2="23" />
                            <line x1="4.22" y1="4.22" x2="5.64" y2="5.64" />
                            <line x1="18.36" y1="18.36" x2="19.78" y2="19.78" />
                            <line x1="1" y1="12" x2="3" y2="12" />
                            <line x1="21" y1="12" x2="23" y2="12" />
                            <line x1="4.22" y1="19.78" x2="5.64" y2="18.36" />
                            <line x1="18.36" y1="5.64" x2="19.78" y2="4.22" />
                        </svg>
                    </button>
                    <button class="action-btn clear-btn" onclick="clearAll()" style="width: auto; padding: 0 1rem;">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <path d="M3 6h18"></path>
                            <path d="M19 6v14c0 1-1 2-2 2H7c-1 0-2-1-2-2V6"></path>
                            <path d="M8 6V4c0-1 1-2 2-2h4c1 0 2 1 2 2v2"></path>
                        </svg>
                        Clear
                    </button>
                </div>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="inputText">Input Script</label>
                    <span style="font-size: 0.75rem; color: var(--text-muted);">Replaces "abab" with newline</span>
                </div>
                <textarea id="inputText" placeholder="Paste your script here...&#10;Example: line1 abab line2"
                    spellcheck="false" oninput="processText()"></textarea>
            </div>

            <div class="input-group">
                <div class="label-row">
                    <label for="outputText">Processed Output</label>
                    <button class="primary action-btn" onclick="copyToClipboard()"
                        style="width: auto; padding: 0.5rem 1rem;">
                        <svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"
                            stroke-linecap="round" stroke-linejoin="round">
                            <rect x="9" y="9" width="13" height="13" rx="2" ry="2"></rect>
                            <path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"></path>
                        </svg>
                        Copy
                    </button>
                </div>
                <textarea id="outputText" readonly spellcheck="false"
                    placeholder="Result will appear here..."></textarea>
            </div>
        </div>
    </div>

    <div id="toast">Copied to clipboard!</div>

    <script>
        function processText() {
            const input = document.getElementById("inputText");
            const output = document.getElementById("outputText");
            let text = input.value;
            text = text.replace(/abab/g, "\n");
            text = text.replace(/\t/g, " ");
            text = text.replace(/ +/g, " ");
            output.value = text;
        }

        function clearAll() {
            document.getElementById("inputText").value = "";
            document.getElementById("outputText").value = "";
            document.getElementById("inputText").focus();
        }

        function copyToClipboard() {
            const outputText = document.getElementById("outputText");
            if (!outputText.value) return;
            outputText.select();
            outputText.setSelectionRange(0, 99999);
            try {
                navigator.clipboard.writeText(outputText.value).then(() => {
                    showToast("Copied to clipboard!");
                }).catch(() => {
                    document.execCommand('copy');
                    showToast("Copied to clipboard!");
                });
            } catch (err) {
                document.execCommand('copy');
                showToast("Copied to clipboard!");
            }
        }

        function showToast(message) {
            const toast = document.getElementById("toast");
            toast.textContent = message;
            toast.className = "show";
            setTimeout(() => { toast.className = ""; }, 3000);
        }
    </script>
    <script src="assets/js/theme.js"></script>

    <div class="footer">
        <p>Modern Network Tools Suite • Built with ❤️ for Network Engineers</p>
    </div>
</body>

</html>
